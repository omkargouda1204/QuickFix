plugins {
    alias(libs.plugins.android.application)

    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'

}

// ── Load Supabase credentials from supabase.properties (never in source) ──
def supabasePropsFile = rootProject.file("supabase.properties")
def supabaseProps = new Properties()
if (supabasePropsFile.exists()) {
    supabasePropsFile.withInputStream { supabaseProps.load(it) }
} else {
    logger.warn("WARNING: supabase.properties not found — BuildConfig fields will be empty")
}

// ── Load local machine-only properties (for secret keys like Razorpay key id) ──
def localPropsFile = rootProject.file("local.properties")
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def razorpayKeyId = localProps.getProperty('RAZORPAY_KEY_ID', supabaseProps.getProperty('RAZORPAY_KEY_ID', ''))
def createOrderFnUrl = supabaseProps.getProperty(
        'SUPABASE_CREATE_ORDER_FN_URL',
        (supabaseProps.getProperty('SUPABASE_URL', '') ?: '') + '/functions/v1/create-order'
)
def aiAssistantFnUrl = supabaseProps.getProperty(
        'SUPABASE_AI_ASSISTANT_FN_URL',
        (supabaseProps.getProperty('SUPABASE_URL', '') ?: '') + '/functions/v1/ai-assistant'
)
def offerValidationFnUrl = supabaseProps.getProperty(
        'SUPABASE_OFFER_VALIDATION_FN_URL',
        (supabaseProps.getProperty('SUPABASE_URL', '') ?: '') + '/functions/v1/offer-validation'
)
def createEmergencyFnUrl = supabaseProps.getProperty(
        'SUPABASE_CREATE_EMERGENCY_URL',
        (supabaseProps.getProperty('SUPABASE_URL', '') ?: '') + '/functions/v1/create-emergency'
)

android {
    namespace 'com.example.quickfix'
    compileSdk 36

    // Keep build green while locale files are being completed.
    lint {
        disable 'MissingTranslation'
    }

    defaultConfig {
        applicationId "com.example.quickfix"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject secrets as BuildConfig constants
        buildConfigField "String", "SUPABASE_URL",                "\"${supabaseProps.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY",           "\"${supabaseProps.getProperty('SUPABASE_ANON_KEY', '')}\""
        buildConfigField "String", "SUPABASE_BUCKET_ID_PROOF",    "\"${supabaseProps.getProperty('SUPABASE_BUCKET_ID_PROOF', 'QuickFix')}\""
        buildConfigField "String", "SUPABASE_BUCKET_BUSINESS_IMG","\"${supabaseProps.getProperty('SUPABASE_BUCKET_BUSINESS_IMG', 'business-images')}\""
        // Edge Function URL for FCM push notifications (stored securely, never hardcoded)
        buildConfigField "String", "SUPABASE_NOTIFY_FN_URL",     "\"${supabaseProps.getProperty('SUPABASE_NOTIFY_FN_URL', '')}\""
        buildConfigField "String", "SUPABASE_CREATE_ORDER_FN_URL","\"${createOrderFnUrl}\""
        buildConfigField "String", "SUPABASE_AI_ASSISTANT_FN_URL","\"${aiAssistantFnUrl}\""
        buildConfigField "String", "SUPABASE_OFFER_VALIDATION_FN_URL","\"${offerValidationFnUrl}\""
        buildConfigField "String", "SUPABASE_CREATE_EMERGENCY_URL","\"${createEmergencyFnUrl}\""
        buildConfigField "String", "RAZORPAY_KEY_ID",            "\"${razorpayKeyId}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Firebase BoM — manages all Firebase SDK versions together
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    // Firebase Authentication (Email/Password + Google Sign-In)
    implementation 'com.google.firebase:firebase-auth'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // FusedLocationProviderClient (GPS live location)
    implementation 'com.google.android.gms:play-services-location:21.3.0'


    // HTTP client for backend API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing
    implementation 'org.json:json:20231013'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image loading (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // MPAndroidChart for pie charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Retrofit (Supabase REST integration)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Razorpay Checkout (test mode key configured via BuildConfig.RAZORPAY_KEY_ID)
    implementation 'com.razorpay:checkout:1.6.33'

    // Compact ViewPager2 dots indicator for home banners
    implementation 'com.tbuonomo:dotsindicator:5.1.0'

    // ML Kit Image Labeling for on-device image analysis
    implementation 'com.google.mlkit:image-labeling:17.0.8'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

apply plugin: 'com.google.gms.google-services'
