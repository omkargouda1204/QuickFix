plugins {
    alias(libs.plugins.android.application)

    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'

}

// ── Load Supabase credentials from supabase.properties (never in source) ──
def supabasePropsFile = rootProject.file("supabase.properties")
def supabaseProps = new Properties()
if (supabasePropsFile.exists()) {
    supabasePropsFile.withInputStream { supabaseProps.load(it) }
} else {
    logger.warn("WARNING: supabase.properties not found — BuildConfig fields will be empty")
}

android {
    namespace 'com.example.quickfix'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.quickfix"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject secrets as BuildConfig constants
        buildConfigField "String", "SUPABASE_URL",                "\"${supabaseProps.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY",           "\"${supabaseProps.getProperty('SUPABASE_ANON_KEY', '')}\""
        buildConfigField "String", "SUPABASE_BUCKET_ID_PROOF",    "\"${supabaseProps.getProperty('SUPABASE_BUCKET_ID_PROOF', 'QuickFix')}\""
        buildConfigField "String", "SUPABASE_BUCKET_BUSINESS_IMG","\"${supabaseProps.getProperty('SUPABASE_BUCKET_BUSINESS_IMG', 'business-images')}\""
        // Edge Function URL for FCM push notifications (stored securely, never hardcoded)
        buildConfigField "String", "SUPABASE_NOTIFY_FN_URL",     "\"${supabaseProps.getProperty('SUPABASE_NOTIFY_FN_URL', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Firebase BoM — manages all Firebase SDK versions together
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    // Firebase Authentication (Email/Password + Google Sign-In)
    implementation 'com.google.firebase:firebase-auth'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // FusedLocationProviderClient (GPS live location)
    implementation 'com.google.android.gms:play-services-location:21.3.0'


    // HTTP client for backend API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing
    implementation 'org.json:json:20231013'

    // Image loading (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // MPAndroidChart for pie charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Retrofit (Supabase REST integration)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

apply plugin: 'com.google.gms.google-services'